<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einladung teilen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.th-dark{--bg:#131517;--sf:#1B1E21;--sf2:#24282C;--ln:#30353A;--off:#4A5157;--tx:#ECEEF0;--mu:#A1A8AE;--pr:#5CC2D6;--onpr:#062A31;--prbg:rgba(92,194,214,.14);--swim:#5B8FF2;--swimbg:rgba(91,143,242,.15);--bomb:#F3BA4E;--bombbg:rgba(243,186,78,.13);--bo:#F07A66;--bobg:rgba(240,122,102,.13);--scrim:rgba(4,6,8,.66)}
.th-light{--bg:#F3F7F7;--sf:#FFFFFF;--sf2:#E7EFF0;--ln:#D0DDE0;--off:#B4C6CA;--tx:#10212A;--mu:#536970;--pr:#147A93;--onpr:#FFFFFF;--prbg:rgba(20,122,147,.10);--swim:#2456C9;--swimbg:rgba(36,86,201,.10);--bomb:#9A5B00;--bombbg:rgba(214,140,20,.14);--bo:#C23A28;--bobg:rgba(194,58,40,.09);--scrim:rgba(16,33,42,.45)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
</style>
</helmet>
<div class="{{tc}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; height: 56px; padding: 0 4px; flex-shrink: 0">
    <a href="i04-spieler.dc.html" aria-label="Schließen" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--tx); justify-self: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <div style="text-align: center; font-size: 17px; font-weight: 600">In die Gruppe einladen</div>
    <div></div>
  </header>
  <div style="flex: 1; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 18px; align-items: stretch">
    <p style="margin: 0; color: var(--mu); text-align: center; text-wrap: pretty">Am Tisch: Code scannen lassen. Sonst den Link schicken. Wer als Gast mitgespielt hat, kann sich darüber seinen Gast holen.</p>
    <div style="align-self: center; width: 248px; height: 248px; padding: 16px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); grid-auto-rows: 1fr" role="img" aria-label="QR-Code der Einladung in die Donnerstagsrunde">
      <sc-for list="{{qr}}" as="q" hint-placeholder-count="441"><span style="background: {{q.c}}"></span></sc-for>
    </div>
    <div style="text-align: center; font-size: 20px; font-weight: 700">Donnerstagsrunde</div>
    <div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--sf2)">
      <span style="flex: 1; min-width: 0; font-size: 14px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">swimscore.app/e/Hx82mQp4Lw</span>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--sf); font-size: 14px; font-weight: 500">Kopieren</button>
    </div>
  </div>
  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 56px; border-radius: 14px; border: 0; background: var(--pr); color: var(--onpr); font-size: 16px; font-weight: 600">Link teilen</button>
    <button type="button" style="height: 48px; border-radius: 14px; border: 0; background: transparent; color: var(--tx); font-size: 15px; font-weight: 500">Link erneuern</button>
    <span style="font-size: 13px; color: var(--mu); text-align: center; text-wrap: pretty">Erneuern macht den alten Link und den alten Code ungültig.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>

var QR = (function () {
  var cells = [];
  function finder(x, y, cx, cy) {
    var dx = x - cx, dy = y - cy;
    if (dx < -1 || dy < -1 || dx > 7 || dy > 7) return null;
    if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return false;
    return dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
  }
  for (var y = 0; y < 21; y++) {
    for (var x = 0; x < 21; x++) {
      var v = finder(x, y, 0, 0);
      if (v === null) v = finder(x, y, 14, 0);
      if (v === null) v = finder(x, y, 0, 14);
      if (v === null) v = ((x * 11 + y * 5 + x * y * 7) % 7) < 3;
      cells.push({ c: v ? '#10212A' : 'transparent' });
    }
  }
  return cells;
})();
class Component extends DCLogic {
  renderVals() {
    return { tc: this.props.theme === 'light' ? 'th-light' : 'th-dark', qr: QR };
  }
}
</script>
</body>
</html>
